  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080810'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial Black,sans-serif' font-size='13' font-weight='900' fill='%23e8153a'%3ESW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    .about-hero {
      background: var(--ink2); border-bottom: 1px solid var(--border);
      padding: 80px 40px; text-align: center;
      position: relative; overflow: hidden;
    }
    .about-hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=1400&auto=format&fit=crop&q=60');
      background-size: cover; background-position: center;
      opacity: 0.06;
    }
    .about-hero-inner { position: relative; z-index: 1; }
    .about-hero h1 {
      font-family: var(--font-d); font-size: clamp(3rem, 6vw, 5.5rem);
      letter-spacing: 4px; margin-bottom: 16px;
      background: linear-gradient(135deg, var(--white), var(--gold));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .about-hero p { font-size: 16px; color: var(--muted); font-weight: 300; max-width: 500px; margin: 0 auto; }

    .about-body { max-width: 1100px; margin: 0 auto; padding: 80px 40px; }

    /* Story section */
    .about-story { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; margin-bottom: 80px; }
    .story-img {
      aspect-ratio: 4/5;
      background-image: url('profile.jpg');
      background-size: cover; background-position: center;
      position: relative;
    }
    .story-img::after {
      content: ''; position: absolute; inset: 0;
      border: 1px solid var(--border-r); transform: translate(12px, 12px);
      pointer-events: none;
    }
    .story-text .sec-eyebrow { margin-bottom: 12px; }
    .story-text h2 { font-family: var(--font-s); font-size: clamp(1.8rem, 3vw, 2.8rem); color: var(--white); margin-bottom: 20px; line-height: 1.2; }
    .story-text h2 em { font-style: italic; background: linear-gradient(135deg, var(--red), var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .story-text p { font-size: 15px; color: var(--muted); line-height: 1.9; font-weight: 300; margin-bottom: 16px; }

    /* Values grid */
    .values-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-bottom: 80px; }
    .val-card {
      background: var(--ink2); border: 1px solid var(--border);
      padding: 36px 28px; transition: background .3s, border-color .3s;
    }
    .val-card:hover { background: var(--ink3); border-color: var(--border-r); }
    .val-num { font-family: var(--font-d); font-size: 3rem; color: rgba(255,255,255,.05); line-height: 1; margin-bottom: 16px; }
    .val-icon { font-size: 1.5rem; color: var(--red); margin-bottom: 14px; display: block; }
    .val-card h4 { font-family: var(--font-d); font-size: 1.3rem; letter-spacing: 1px; color: var(--white); margin-bottom: 10px; }
    .val-card p { font-size: 13px; color: var(--muted); line-height: 1.75; font-weight: 300; }

    /* Stats row */
    .about-stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 3px; margin-bottom: 80px;
    }
    .astat {
      background: var(--ink2); border: 1px solid var(--border);
      padding: 32px 24px; text-align: center;
    }
    .astat strong { font-family: var(--font-d); font-size: 2.5rem; color: var(--red); display: block; margin-bottom: 6px; }
    .astat span { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }

    /* CTA strip */
    .about-cta {
      background: var(--ink2); border: 1px solid var(--border-r);
      padding: 48px; display: flex; align-items: center;
      justify-content: space-between; gap: 32px; flex-wrap: wrap;
    }
    .about-cta h3 { font-family: var(--font-s); font-size: clamp(1.4rem, 2.5vw, 2rem); color: var(--white); }
    .about-cta p { font-size: 14px; color: var(--muted); margin-top: 6px; font-weight: 300; }
    .about-cta-btns { display: flex; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }

    @media (max-width: 860px) {
      .about-story { grid-template-columns: 1fr; gap: 40px; }
      .story-img { aspect-ratio: 16/9; }
      .values-grid { grid-template-columns: 1fr 1fr; }
      .about-stats { grid-template-columns: repeat(2, 1fr); }
      .about-cta { flex-direction: column; }
      .about-body { padding: 60px 20px; }
      .about-hero { padding: 60px 20px; }
    }
    @media (max-width: 480px) {
      .values-grid { grid-template-columns: 1fr; }
      .about-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

<body>
  <!-- Announcement Bar -->
  
  <script src="nav.js" data-page="about"></script>


  <div id="toast" class="toast"></div>
  <script src="data.js"></script>
  <script src="wishlist.js"></script>
  <script src="shared-ui.js"></script>
  <script src="main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nb = document.getElementById('navbar');
      const pr = document.getElementById('nav-progress');
      window.addEventListener('scroll', () => {
        nb?.classList.toggle('scrolled', window.scrollY > 60);
        if (pr) pr.style.width = Math.min((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100, 100) + '%';
      }, { passive: true });
    });
  </script>

  <button class="scroll-top" id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top"><i class="fas fa-chevron-up"></i></button>
  <!-- Cookie Consent -->
  <div class="cookie-banner" id="cookie-banner">
    <p>We use cookies to improve your experience. By continuing, you agree to our <a href="privacy.html">Privacy Policy</a>.</p>
    <div class="cookie-btns">
      <button onclick="acceptCookies()">Accept All</button>
      <button onclick="acceptCookies()" class="cookie-ghost">Necessary Only</button>
    </div>
  </div>
  <script>
    function acceptCookies(){document.getElementById('cookie-banner').style.display='none';localStorage.setItem('sw_cookies_accepted','1')}
    if(localStorage.getItem('sw_cookies_accepted'))document.getElementById('cookie-banner').style.display='none';
  </script>
