  <style>
    /* ── Contact page styles ── */
    .contact-wrap {
      padding-top: 64px;
      min-height: 100vh;
      background: var(--ink);
    }

    /* Page header */
    .contact-hero {
      background: var(--ink2);
      border-bottom: 1px solid var(--border);
      padding: 60px 40px 48px;
      text-align: center;
    }
    .contact-hero .sec-eyebrow { justify-content: center; margin-bottom: 12px; }
    .contact-hero h1 {
      font-family: var(--font-d);
      font-size: clamp(2.5rem, 5vw, 4rem);
      letter-spacing: 3px;
      background: linear-gradient(135deg, var(--white), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .contact-hero p { font-size: 15px; color: var(--muted); font-weight: 300; }

    /* Main grid */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 3px;
      max-width: 1100px;
      margin: 48px auto;
      padding: 0 40px;
    }

    /* Info panel */
    .contact-info {
      background: var(--ink2);
      border: 1px solid var(--border);
      padding: 40px 32px;
    }
    .contact-info h3 {
      font-family: var(--font-d);
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: var(--white);
      margin-bottom: 28px;
    }
    .ci-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }
    .ci-item:last-of-type { border-bottom: none; }
    .ci-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      background: var(--red-lo); border: 1px solid var(--border-r);
      display: flex; align-items: center; justify-content: center;
      color: var(--red); font-size: 14px;
    }
    .ci-body { flex: 1; min-width: 0; }
    .ci-label {
      font-size: 9px; font-weight: 700; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--muted);
      display: block; margin-bottom: 6px;
    }
    .ci-value {
      font-size: 14px; font-weight: 500; color: var(--white);
      display: block; line-height: 1.5;
    }
    .ci-value a {
      color: var(--white);
      transition: color 0.2s;
      word-break: break-all;
    }
    .ci-value a:hover { color: var(--red); }
    .ci-sub {
      font-size: 12px; color: var(--muted); display: block;
      margin-top: 2px; font-weight: 300;
    }

    /* Hours */
    .ci-hours { margin-top: 28px; }
    .ci-hours-title {
      font-size: 9px; font-weight: 700; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    }
    .ci-hour-row {
      display: flex; justify-content: space-between;
      font-size: 12px; padding: 6px 0;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .ci-hour-row span:last-child { color: var(--white); font-weight: 500; }

    /* Form panel */
    .contact-form {
      background: var(--ink2);
      border: 1px solid var(--border);
      padding: 40px 36px;
    }
    .contact-form h3 {
      font-family: var(--font-d);
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: var(--white);
      margin-bottom: 28px;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%; padding: 13px 16px;
      background: var(--ink3); border: 1px solid var(--border);
      color: var(--white); font-family: var(--font-b); font-size: 13px;
      outline: none; transition: border-color 0.3s;
      resize: none;
      appearance: none;
    }
    .form-group select { cursor: pointer; }
    .form-group select option { background: var(--ink2); }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--border-r); }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--muted); }
    .form-group textarea { height: 130px; }

    .form-submit {
      width: 100%; padding: 15px;
      background: var(--red); color: #fff;
      font-family: var(--font-b); font-size: 13px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 0.25s, transform 0.2s;
      position: relative; overflow: hidden;
      margin-top: 4px;
    }
    .form-submit::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      transform: skewX(-15deg); transition: left 0.5s;
    }
    .form-submit:hover { background: var(--red2); transform: translateY(-2px); }
    .form-submit:hover::before { left: 160%; }

    @media (max-width: 860px) {
      .contact-grid { grid-template-columns: 1fr; padding: 0 20px; }
      .form-row { grid-template-columns: 1fr; }
      .contact-hero { padding: 48px 20px 36px; }
    }
    @media (max-width: 480px) {
      .contact-info, .contact-form { padding: 28px 20px; }
    }
  </style>

<body>
  <!-- Announcement Bar -->
  
  <script src="nav.js" data-page="contact"></script>


  <div id="toast" class="toast"></div>
  <script src="data.js"></script>
  <script src="wishlist.js"></script>
  <script src="shared-ui.js"></script>
  <script src="main.js"></script>
  <script>
    // Navbar scroll state
    document.addEventListener('DOMContentLoaded', () => {
      const nb = document.getElementById('navbar');
      const pr = document.getElementById('nav-progress');
      window.addEventListener('scroll', () => {
        nb?.classList.toggle('scrolled', window.scrollY > 60);
        if (pr) {
          const pct = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
          pr.style.width = Math.min(pct, 100) + '%';
        }
      }, { passive: true });
    });

    function sendMessage() {
      const name    = document.getElementById('c-name').value.trim();
      const email   = document.getElementById('c-email').value.trim();
      const subject = document.getElementById('c-subject').value;
      const message = document.getElementById('c-message').value.trim();

      if (!name || !email || !subject || !message) {
        toast('Please fill in all fields.', 'error');
        return;
      }
      const rx = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!rx.test(email)) {
        toast('Please enter a valid email address.', 'error');
        return;
      }

      // Build mailto link and open it
      const sub  = encodeURIComponent('[Shonowear] ' + subject + ' — from ' + name);
      const body = encodeURIComponent(
        'Name: ' + name + '\nEmail: ' + email + '\n\nMessage:\n' + message
      );
      window.location.href = `mailto:support@shonowear.com?subject=${sub}&body=${body}`;

      // Clear form
      document.getElementById('c-name').value = '';
      document.getElementById('c-email').value = '';
      document.getElementById('c-subject').value = '';
      document.getElementById('c-message').value = '';

      toast('Opening your email client… 📬', 'success');
    }
  </script>

  <button class="scroll-top" id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top"><i class="fas fa-chevron-up"></i></button>
  <!-- Cookie Consent -->
  <div class="cookie-banner" id="cookie-banner">
    <p>We use cookies to improve your experience. By continuing, you agree to our <a href="privacy.html">Privacy Policy</a>.</p>
    <div class="cookie-btns">
      <button onclick="acceptCookies()">Accept All</button>
      <button onclick="acceptCookies()" class="cookie-ghost">Necessary Only</button>
    </div>
  </div>
  <script>
    function acceptCookies(){document.getElementById('cookie-banner').style.display='none';localStorage.setItem('sw_cookies_accepted','1')}
    if(localStorage.getItem('sw_cookies_accepted'))document.getElementById('cookie-banner').style.display='none';
  </script>

    <i class="fab fa-whatsapp"></i>
